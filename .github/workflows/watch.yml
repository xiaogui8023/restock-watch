name: 钟山烟语补货巡检

on:
  schedule:
    # 每 15 分钟一次（UTC 时区，24 小时都跑；脚本自己按 08:00-23:50 / 夜间免打扰判断是否推送）
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check=正常巡检 / test_push=只发一条测试消息"
        default: "check"
        required: false

concurrency:
  group: watch-restock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 测试推送
        if: ${{ github.event.inputs.mode == 'test_push' }}
        env:
          TZ: Asia/Shanghai
        run: python test_push.py

      - name: 巡检一轮
        if: ${{ github.event.inputs.mode != 'test_push' }}
        env:
          TZ: Asia/Shanghai
        run: python monitor.py --stock

      - name: 回写状态文件
        run: |
          git config user.name "watch-bot"
          git config user.email "watch-bot@users.noreply.github.com"
          git add -A state data reports
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "巡检 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
          fi
